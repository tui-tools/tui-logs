# GoReleaser configuration for tui-logs, from the family's shared template.
#
# One repository, one binary, one tag series: `git tag v0.1.0 && git push
# origin v0.1.0` is what publishes a release.
version: 2

project_name: tui-logs

before:
  hooks:
    - go mod download

builds:
  - id: tui-logs
    main: ./cmd/tui-logs
    binary: tui-logs
    env:
      # Static binaries: no libc dependency, one file to copy anywhere.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: tui-logs
    ids:
      - tui-logs
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - examples/config.toml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
